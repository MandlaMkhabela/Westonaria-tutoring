<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - Precision Learning</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .cancelled-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
        }
        .cancelled-card {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }
        .cancelled-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
        }
        .cancelled-card h1 {
            color: var(--text-dark);
            margin-bottom: 1rem;
        }
        .cancelled-card p {
            color: var(--text-medium);
            font-size: 1.125rem;
            margin-bottom: 2rem;
            line-height: 1.8;
        }
        .options {
            background: var(--background);
            padding: 2rem;
            border-radius: 12px;
            margin-top: 2rem;
        }
        .options h3 {
            color: var(--primary);
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="cancelled-container">
        <div class="cancelled-card">
            <div class="cancelled-icon">❌</div>
            <h1>Payment Cancelled</h1>
            <p>Your payment was cancelled. No charges have been made to your account.</p>
            
            <div class="options">
                <h3>What would you like to do?</h3>
                <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem;">
                    <a href="index.html#pricing" class="btn btn-primary">Try Again</a>
                    <a href="index.html#contact" class="btn btn-outline">Contact Me</a>
                    <a href="https://wa.me/27XXXXXXXXX?text=Hi!%20I%20need%20help%20with%20payment" class="btn btn-whatsapp" target="_blank">
                        WhatsApp for Help
                    </a>
                </div>
            </div>
            
            <p style="margin-top: 2rem; font-size: 0.95rem; color: var(--text-light);">
                If you're having trouble with online payment, you can also arrange a bank transfer. Just contact me!
            </p>
        </div>
    </div>
</body>
</html>
