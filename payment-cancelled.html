<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Cancelled — West Rand Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wr-status-page">
    <div class="wr-status-card">
        <div class="wr-status-icon">❌</div>
        <h1>Payment Cancelled</h1>
        <p>No charge was made. Your pack is still waiting whenever you're ready.</p>

        <div class="wr-status-actions">
            <a href="index.html#subjects" class="wr-btn wr-btn-primary"><i class="fas fa-arrow-left"></i> Back to Subject Packs</a>
            <button class="wr-btn wr-btn-whatsapp wa-help-btn"><i class="fab fa-whatsapp"></i> Need Help?</button>
        </div>
    </div>
</div>

<script>
    const WHATSAPP_NUMBER = '27XXXXXXXXX'; // ← same number as script.js
    document.querySelectorAll('.wa-help-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const msg = "Hi! My payment on West Rand Exam Prep was cancelled and I need help finishing my order.";
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        });
    });
</script>
</body>
</html>
