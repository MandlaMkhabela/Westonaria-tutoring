<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled — West Rand Exam Prep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .cancel-page { min-height: 100vh; display: flex; flex-direction: column; }
        .cancel-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: radial-gradient(ellipse at 50% 0%, rgba(245,158,11,0.06) 0%, transparent 50%);
        }
        .cancel-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 48px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .cancel-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--warning), var(--brand-red));
        }
        .cancel-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(153,27,27,0.1));
            border: 2px solid rgba(245,158,11,0.3);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
        }
        .cancel-icon i { font-size: 1.8rem; color: var(--warning); }
        .cancel-card h1 { font-family: var(--font-heading); font-size: 1.5rem; margin-bottom: 10px; }
        .cancel-card p { color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5; }
        .cancel-actions { display: flex; flex-direction: column; gap: 10px; }
        .cancel-actions a {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px; border-radius: var(--radius-sm);
            font-weight: 700; font-size: 0.95rem; transition: var(--transition);
        }
        .btn-retry {
            background: linear-gradient(135deg, var(--brand-red), var(--brand-red-dark));
            color: #fff;
        }
        .btn-retry:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(153,27,27,0.3); }
        .btn-back {
            background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
        }
        .btn-back:hover { border-color: var(--text-secondary); color: var(--text); }
    </style>
</head>
<body class="cancel-page">
    <header class="main-header">
        <div class="container">
            <nav class="navbar">
                <a href="index.html" class="logo">
                    <span class="logo-icon"><i class="fas fa-graduation-cap"></i></span>
                    <div class="logo-text">
                        <span class="logo-first">West Rand</span>
                        <span class="logo-second">EXAM PREP</span>
                    </div>
                </a>
            </nav>
        </div>
    </header>
    <main class="cancel-main">
        <div class="container">
            <div class="cancel-card">
                <div class="cancel-icon">
                    <i class="fas fa-times"></i>
                </div>
                <h1>Payment Cancelled</h1>
                <p>No worries — your card was not charged. You can try again whenever you are ready.</p>
                <div class="cancel-actions">
                    <a href="index.html" class="btn-retry">
                        <i class="fas fa-arrow-left"></i> Back to Questions
                    </a>
                    <a href="#" class="btn-back" onclick="history.back(); return false;">
                        <i class="fas fa-redo"></i> Try Again
                    </a>
                </div>
            </div>
        </div>
    </main>
    <footer class="main-footer" style="padding: 20px 0;">
        <div class="container">
            <div class="footer-bottom" style="border: none;">
                <p>West Rand Exam Prep</p>
            </div>
        </div>
    </footer>
</body>
</html>
