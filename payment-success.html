<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful — West Rand Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wr-status-page">
    <div class="wr-status-card">
        <div class="wr-status-icon">✅</div>
        <h1>You're in!</h1>
        <p id="wr-status-sub">Your payment went through — here's your instant access.</p>

        <div class="wr-delivery-box" id="wr-delivery-box">
            <!-- Filled in by JS -->
        </div>

        <p style="font-size:0.85rem;color:var(--wr-silver);margin-bottom:24px;">
            Lost this page? WhatsApp us your proof of payment and we'll resend your links right away.
        </p>

        <div class="wr-status-actions">
            <button class="wr-btn wr-btn-whatsapp wa-help-btn"><i class="fab fa-whatsapp"></i> Message on WhatsApp</button>
            <a href="index.html" class="wr-btn wr-btn-outline"><i class="fas fa-store"></i> Browse More Packs</a>
        </div>
    </div>
</div>

<script src="products.js"></script>
<script>
    const WHATSAPP_NUMBER = '27XXXXXXXXX'; // ← same number as script.js

    function waHelpHandler() {
        document.querySelectorAll('.wa-help-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const productId = new URLSearchParams(window.location.search).get('product') || '';
                const msg = `Hi! I just paid for the "${productId}" pack on West Rand Exam Prep and need my access links resent.`;
                window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
            });
        });
    }

    function renderDelivery() {
        const params    = new URLSearchParams(window.location.search);
        const productId = params.get('product');
        const box       = document.getElementById('wr-delivery-box');
        const sub        = document.getElementById('wr-status-sub');
        const product   = productId ? window.getProductById(productId) : null;

        if (!product) {
            box.innerHTML = `
                <h3>We couldn't identify your pack automatically</h3>
                <p style="color:var(--wr-silver);font-size:0.9rem;">
                    No problem — message us on WhatsApp with your proof of payment and we'll send your
                    video and notes links straight away.
                </p>`;
            return;
        }

        sub.textContent = `Grade ${product.grade} ${product.subject} is unlocked — links below.`;

        box.innerHTML = `
            <h3>Grade ${product.grade} — ${product.subject}</h3>
            <a class="wr-delivery-link" href="${product.youtubeUrl}" target="_blank" rel="noopener">
                <i class="fab fa-youtube"></i> Watch the video lesson playlist
            </a>
            <a class="wr-delivery-link" href="${product.driveUrl}" target="_blank" rel="noopener">
                <i class="fas fa-folder-open"></i> Open notes &amp; past papers folder
            </a>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderDelivery();
        waHelpHandler();
    });
</script>
</body>
</html>
